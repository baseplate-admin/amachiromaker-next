name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# No workflow-level concurrency: every push/PR run is allowed to finish instead
# of a newer run cancelling an older one. GitHub concurrency groups keep only
# one running and one pending run, so any queued group would still cancel
# previously pending runs. The deploy job has its own group because GitHub
# Pages can only publish one deployment at a time.
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            - run: npm run build
              env:
                  STATIC_EXPORT: "true"
                  NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./out

    deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        concurrency:
            group: github-pages-deploy
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
